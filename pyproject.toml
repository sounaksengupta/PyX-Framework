[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytestx"
version = "0.1.0"
description = "A Python-native, keyword-driven test automation framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
pyx = "pyx.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/pyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
